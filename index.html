<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatGPT</title>
<meta name="theme-color" content="#ffffff" id="themeMeta">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;margin:0;padding:0;background:#fff;color:#000;overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;}
body{position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

/* HEADER */
.header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:52px;
display:flex;align-items:center;z-index:20;background:#fff;
border-bottom:1px solid #e7e7e9;padding:0 16px;direction:ltr;}
.header-spacer{flex:1;}
.header-title{font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#1c1c1e;}
.header-left{display:flex;align-items:center;flex-direction:row;gap:22px;direction:ltr;flex:0 0 auto;}
.header-right-group{display:flex;align-items:center;gap:10px;direction:ltr;flex:0 0 auto;}
.header-icon{width:22px;height:22px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.dots{width:20px;height:20px;fill:#000;stroke:none;}

/* CHAT */
.chat{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;
bottom:78px;overflow-y:auto;overflow-x:hidden;padding:24px 18px 20px;display:flex;
flex-direction:column;gap:28px;direction:ltr;scrollbar-width:none;background:#fff;}
.chat::-webkit-scrollbar{display:none;}

/* USER MESSAGE */
.user{align-self:flex-start;max-width:78%;padding:13px 20px;background:#e8f3ff;
border-radius:20px;color:#1173d4;font-size:17px;font-weight:500;line-height:1.4;
direction:rtl;flex-shrink:0;}

/* ASSISTANT */
.assistant{align-self:flex-start;width:100%;color:#000;font-size:17px;font-weight:500;
line-height:1.6;text-align:right;direction:rtl;}
.ai-text{display:block;width:100%;}

/* ACTIONS */
.actions{width:100%;margin-top:12px;display:flex;justify-content:flex-end;
align-items:center;gap:24px;direction:ltr;}
.action{width:22px;height:22px;stroke:#6b6b70;fill:none;stroke-width:2.1;
stroke-linecap:round;stroke-linejoin:round;}
.dots-action{font-size:20px;font-weight:700;color:#6b6b70;letter-spacing:1px;line-height:1;}

/* BOTTOM INPUT */
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));
background:#fff;z-index:30;}
.inputbar{width:100%;height:56px;background:#efeff0;border-radius:28px;display:flex;
align-items:center;direction:ltr;padding:5px 6px 5px 3px;gap:12px;overflow:visible;}
.voice{width:48px;height:48px;min-width:48px;border-radius:50%;background:#0a84ff;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 0 0 4px #efeff0;margin-left:2px;}
.voice svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;}
.voice .wave-icon{display:flex;}
.voice .send-icon{display:none;}
.mic{width:25px;height:25px;min-width:25px;fill:none;stroke:#000;stroke-width:2;
stroke-linecap:round;stroke-linejoin:round;}
.input{min-width:0;flex:1;width:0;border:none;outline:none;background:transparent;
color:#000;font-family:inherit;font-size:17px;font-weight:600;text-align:right;
direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:clip;}
.input::placeholder{color:#9a9a9e;opacity:1;}
.plus{width:40px;min-width:40px;height:40px;display:flex;align-items:center;
justify-content:center;color:#000;font-size:42px;font-weight:300;line-height:1;}

/* LOGIN */
.login{position:fixed;inset:0;z-index:100;background:#fff;display:none;align-items:center;justify-content:center;padding:24px;direction:rtl;}
.login.show{display:flex;}
.login-card{width:100%;max-width:340px;text-align:center;}
.login-card h1{font-size:26px;margin:0 0 6px;color:#1c1c1e;}
.login-card p{color:#6b6b70;margin:0 0 26px;font-size:15px;}
.login-card input{width:100%;height:52px;border:none;background:#efeff0;border-radius:26px;padding:0 20px;font-size:17px;font-family:inherit;text-align:right;outline:none;margin-bottom:12px;}
.login-card button{width:100%;height:52px;border:none;border-radius:26px;background:#0a84ff;color:#fff;font-size:17px;font-weight:600;font-family:inherit;}
.login-or{margin:18px 0;color:#9a9a9e;font-size:14px;}
#gbtn{display:flex;justify-content:center;}
.login-err{color:#d70015;font-size:14px;min-height:20px;margin-top:10px;}

/* إصلاح الكيبورد على iOS */
html{height:100%;overflow:hidden;}
body{position:fixed;top:0;left:0;width:100%;height:var(--vh,100%);}

/* النقطة الزرقاء + ظهور الكلمات تدريجياً */
.dotwrap{align-self:flex-start;width:100%;display:flex;justify-content:flex-end;padding:4px 4px 0;}
.tdot{width:16px;height:16px;border-radius:50%;background:#3399ff;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.w{opacity:0;filter:blur(3px);transition:opacity .9s ease,filter .9s ease;}
.w.on{opacity:1;filter:none;}
.voice .stop-icon{display:none;width:18px;height:18px;background:#fff;border-radius:4px;}

.pic{display:block;max-width:100%;max-height:320px;border-radius:14px;margin:0 0 8px;}
.assistant .pic{margin-left:auto;}
.fcard{display:block;color:inherit;text-decoration:underline;font-size:15px;margin-bottom:6px;}
.action{padding:8px;margin:-8px;box-sizing:content-box;cursor:pointer;}
.action.liked{stroke:#0a84ff;}
.w{transition:opacity 1.4s cubic-bezier(.22,.61,.36,1),filter 1.4s cubic-bezier(.22,.61,.36,1)!important;filter:blur(4px);}
.pmenu{position:absolute;right:14px;bottom:84px;width:min(310px,calc(100% - 28px));background:#f7f7f8;border-radius:30px;box-shadow:0 8px 40px rgba(0,0,0,.18);padding:10px 12px;direction:rtl;display:none;z-index:60;}
.pmenu.show{display:block;}
.pitem{display:flex;align-items:center;gap:16px;padding:10px 6px;cursor:pointer;font-size:19px;font-weight:700;color:#1c1c1e;}
.pitem i{width:44px;height:44px;min-width:44px;border-radius:50%;background:#ededee;display:flex;align-items:center;justify-content:center;}
.pitem svg{width:22px;height:22px;fill:none;stroke:#1c1c1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:16px;font-size:15px;z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;}
.toast.show{opacity:1;}

/* SPLASH */
.splash{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;align-items:center;justify-content:center;}
.splash.hide{display:none;}
.splash svg{width:88px;height:88px;animation:shine 1.8s ease-in-out infinite;}
@keyframes shine{0%,100%{opacity:.55;filter:drop-shadow(0 0 0 rgba(0,0,0,0))}50%{opacity:1;filter:drop-shadow(0 0 10px rgba(0,0,0,.12))}}

/* LOGIN v2 */
.login-x{position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 18px);width:34px;height:34px;border-radius:50%;background:#efeff0;border:none;color:#8e8e93;font-size:16px;}
.login-logo{width:70px;height:70px;margin:0 auto 20px;}
.auth-btn{width:100%;height:52px;border-radius:26px;border:1px solid #d8d8dc;background:#fff;color:#1c1c1e;font-size:16px;font-weight:600;font-family:inherit;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px;}
.login-toast{display:none;color:#d70015;font-size:13px;margin-top:14px;line-height:1.6;}
.login-toast.show{display:block;}

/* PLUS BADGE / TOGGLE */
.pitem.hidden-opt{display:none;}

/* الترقية */
.up-pill{background:#eef4ff;color:#0a84ff;border:none;border-radius:16px;padding:6px 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px;}
.upmodal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250;display:none;align-items:flex-end;}
.upmodal.show{display:flex;}
.upcard{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom,0px));direction:rtl;text-align:center;}
.upcard h3{margin:0 0 8px;font-size:20px;}
.upcard p{color:#6b6b70;font-size:14px;margin:0 0 20px;}
.upcard button{width:100%;height:50px;border-radius:25px;border:none;background:#000;color:#fff;font-weight:700;font-size:16px;}

/* محرر الكتابة */
.editor{position:fixed;inset:0;background:#fff;z-index:260;display:none;flex-direction:column;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);direction:rtl;}
.editor.show{display:flex;}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;}
.ed-head button{border:none;background:none;font-size:16px;font-weight:700;color:#0a84ff;}
.editor textarea{flex:1;border:none;outline:none;padding:16px;font-size:17px;font-family:inherit;resize:none;direction:rtl;}

/* ===== الشكل المطلوب (v3) ===== */
[hidden]{display:none!important;}
:root{--bg:#fff;--fg:#000;--fg2:#1c1c1e;--mut:#6b6b70;--bar:#efeff0;--line:#e7e7e9;--bub:#e8f3ff;--bubt:#1173d4;--side:#fafafa;--sel:#efeff0;--menut:#616166;--logo:#cdcdd1;--pill:#e6f2ff;--pillt:#0a84ff;--circ:#fff;--sheet:#fff;--set:#f2f2f3;}
html.dark{--bg:#212121;--fg:#f4f4f4;--fg2:#f4f4f4;--mut:#a3a3a8;--bar:#303030;--line:#333;--bub:#1b3a5f;--bubt:#8ec5ff;--side:#171717;--sel:#2b2b2b;--menut:#b8b8bc;--logo:#5b5b60;--pill:#1a3352;--pillt:#4da3ff;--circ:#2a2a2a;--sheet:#2a2a2a;--set:#363636;color-scheme:dark;}
html,body{background:var(--bg);color:var(--fg);}
.shell{position:absolute;inset:0;z-index:2;background:var(--bg);overflow:hidden;transition:transform .34s cubic-bezier(.22,.7,.2,1),border-radius .34s,box-shadow .34s;}
.shell.slide{transform:translateX(calc(-100% + 75px));border-radius:0 46px 46px 0;box-shadow:10px 0 34px rgba(0,0,0,.16);}
.header{height:40px;background:var(--bg);border-bottom:none;padding:0 18px;}
.header-title{color:var(--fg2);}
.header-icon{stroke:var(--fg);width:23px;height:23px;}
.header-right-group{gap:22px;}
.chat{top:calc(40px + env(safe-area-inset-top,0px));background:var(--bg);}
.user{background:var(--bub);color:var(--bubt);}
.assistant{color:var(--fg);}
.bottom{background:var(--bg);}
.inputbar{background:var(--bar);}
.voice{box-shadow:0 0 0 4px var(--bar);}
.mic{stroke:var(--fg);}
.input,.plus{color:var(--fg);}
.up-pill{background:var(--pill);color:var(--pillt);height:38px;padding:0 19px;border-radius:19px;font-size:17px;font-weight:700;font-family:inherit;gap:7px;direction:ltr;align-items:center;display:flex;line-height:1;}
.up-pill svg{width:16px;height:16px;fill:var(--pillt);flex:none;}
/* قائمة + */
.pmenu{left:0;right:0;width:auto;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--bg);border-radius:0;box-shadow:none;padding:6px 26px 10px;}
.pitem{gap:18px;padding:0;height:52px;font-size:20px;font-weight:500;color:var(--menut);}
.pitem i{width:26px;height:26px;min-width:26px;border-radius:0;background:none;}
.pitem svg{width:26px;height:26px;stroke:var(--menut);stroke-width:1.9;fill:none;}
/* الشاشة الافتتاحية والشعار */

.login-logo{width:58px;height:58px;margin:0 auto 20px;}
.login{background:var(--bg);}
.login-card h1{color:var(--fg2);}
.login-card input{background:var(--bar);color:var(--fg);}
.login-x{background:var(--bar);}
.auth-btn{background:var(--bg);color:var(--fg2);border-color:var(--line);}
.upcard{background:var(--sheet);color:var(--fg);}
.upcard p{color:var(--mut);}
.upcard button{background:var(--fg);color:var(--bg);}
.editor{background:var(--bg);color:var(--fg);}
.editor textarea{background:transparent;color:var(--fg);}
.ed-head{border-bottom-color:var(--line);}
/* القائمة الجانبية */
.sidebar-ov{position:fixed;top:0;bottom:0;left:0;width:75px;z-index:3;background:transparent;display:none;}
.sidebar-ov.show{display:block;}
.sidebar{position:fixed;inset:0;z-index:1;background:var(--side);visibility:hidden;transition:visibility 0s linear .36s;direction:rtl;}
.sidebar.show{visibility:visible;transition-delay:0s;}
.sb-in{position:absolute;top:0;bottom:0;left:75px;right:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 26px 0 22px;}
.sb-top{height:34px;display:flex;align-items:center;justify-content:space-between;flex:none;}
.sb-title{font-size:27px;font-weight:700;color:var(--fg);letter-spacing:-.3px;}
.sb-search{width:26px;height:26px;stroke:var(--fg);fill:none;stroke-width:2.2;stroke-linecap:round;cursor:pointer;}
.sb-sinp{flex:none;height:42px;margin-top:10px;border:none;outline:none;border-radius:14px;background:var(--bar);color:var(--fg);padding:0 14px;font-size:16px;font-family:inherit;direction:rtl;}
.sb-nav{margin-top:14px;flex:none;}
.sb-nv{height:54px;display:flex;align-items:center;gap:18px;font-size:21px;font-weight:600;color:var(--fg);cursor:pointer;}
.sb-nv svg{width:26px;height:26px;fill:none;stroke:var(--fg);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.sb-label{flex:none;padding:24px 0 8px;font-size:19px;font-weight:700;color:var(--fg);}
.sb-list{flex:1;overflow-y:auto;padding:0;scrollbar-width:none;}
.sb-list::-webkit-scrollbar{display:none;}
.sb-item{margin:0 -14px;padding:14px;border-radius:16px;font-size:19px;font-weight:600;color:var(--fg);}
.sb-item.on{background:var(--sel);font-weight:600;}
.sb-empty{padding:10px 0;color:var(--mut);font-size:15px;}
.sb-bot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 4px);direction:ltr;}
.sb-gear{width:52px;height:52px;border-radius:50%;background:var(--circ);border:none;display:flex;align-items:center;justify-content:center;padding:0;}
.sb-gear svg{width:28px;height:28px;fill:none;stroke:var(--fg);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.sb-chat{height:52px;padding:0 24px;border-radius:26px;background:#0a84ff;color:#fff;border:none;font-size:20px;font-weight:700;font-family:inherit;display:flex;align-items:center;gap:12px;direction:rtl;}
.sb-chat svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
/* الإعدادات */
.setcard{background:var(--sheet);color:var(--fg);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));direction:rtl;}
.set-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:20px;}
.set-head button{width:34px;height:34px;border-radius:50%;border:none;background:var(--set);color:var(--mut);font-size:15px;}
.set-prof{display:flex;align-items:center;gap:14px;background:var(--set);border-radius:20px;padding:14px 16px;margin-bottom:12px;}
.set-av{width:56px;height:56px;min-width:56px;border-radius:50%;background:#0a84ff center/cover no-repeat;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.set-nm{font-size:18px;font-weight:700;}
.set-ml{font-size:14px;color:var(--mut);margin-top:2px;direction:ltr;text-align:right;}
.set-row{display:flex;align-items:center;justify-content:space-between;background:var(--set);border-radius:20px;padding:16px;margin-bottom:12px;font-size:17px;font-weight:600;}
.tgl{width:52px;height:32px;border-radius:16px;background:#c9c9ce;position:relative;transition:background .2s;flex:none;cursor:pointer;}
.tgl i{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
.tgl.on{background:#34c759;}
.tgl.on i{transform:translateX(20px);}
.set-out{width:100%;height:52px;border-radius:26px;border:none;background:var(--set);color:#ff3b30;font-size:17px;font-weight:700;font-family:inherit;}
.set-out.in{color:#0a84ff;}
/* الوضع الصوتي في الداكن */
html.dark .vo{background:#000;}
html.dark .vo-title,html.dark .vo-name{color:#fff;}
html.dark .vo-head{border-bottom-color:#2c2c2e;}
html.dark .vo-head svg{stroke:#fff;}
html.dark .vo-pill{background:#2a2a2c;}
html.dark .vo-pill b{color:#fff;}
html.dark .vo-mute{background:#2a2a2c;color:#fff;}
html.dark .vo-end{background:#fff;}
html.dark .vo-end svg{stroke:#000;}
html.dark .vo-start{background:#fff;color:#000;}
html.dark .vo-dots i{background:#48484a;}
html.dark .vo-dots i.on{background:#fff;}

/* ===== إخفاء/تخصيص الأزرار ===== */
[data-bhide]{display:none!important;}
/* ===== تأثيرات ظهور الرد ===== */
@keyframes fwIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
@keyframes fwUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeAll{from{opacity:0}to{opacity:1}}
@keyframes blurIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
.fx-fade_word .fw{opacity:0;animation:fwIn .38s both ease-out}
.fx-slide_up .fw{display:inline-block;opacity:0;animation:fwUp .45s both cubic-bezier(.22,.7,.2,1)}
.fx-fade_all{animation:fadeAll .65s both ease-out}
.fx-blur_in{animation:blurIn .8s both ease-out}
.fx-fade_line .fl{display:block;opacity:0;animation:fadeAll .52s both ease-out}
.fx-done,.fx-done .fw,.fx-done .fl{animation:none!important;opacity:1!important;filter:none!important;transform:none!important}
/* ===== إعادة التشغيل ===== */
.reboot{position:fixed;inset:0;z-index:2000;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.reboot.on{opacity:1}
.reboot .lgo{width:96px;height:96px;background:#6b6b70;animation:flick .55s steps(2) infinite}
.reboot.red .lgo{background:#ff1a1a;filter:drop-shadow(0 0 16px rgba(255,0,0,.7))}
@keyframes flick{0%{opacity:1}35%{opacity:.25}55%{opacity:1}80%{opacity:.45}100%{opacity:1}}
/* ===== الوضع الأحمر WORM GPT ===== */
html.worm{--bg:#0b0000;--fg:#ff4d4d;--fg2:#ff2a2a;--mut:#b05a5a;--bar:#1e0909;--line:#3a1010;--bub:#3a0707;--bubt:#ff8080;--side:#130000;--sel:#2a0a0a;--menut:#e07070;--logo:#ff1a1a;--pill:#3a0a0a;--pillt:#ff4040;--circ:#2a0a0a;--sheet:#1a0606;--set:#2a0c0c;color-scheme:dark;}
html.worm .header-title,html.worm .sb-title{text-shadow:0 0 12px rgba(255,0,0,.55);letter-spacing:1px;font-weight:800}
html.worm .voice,html.worm .sb-chat,html.worm .login-card button#gbtnName{background:#e11d1d}
html.worm .tdot{background:#ff2a2a}
html.worm .action.liked{stroke:#ff2a2a}
html.worm .tgl.on{background:#e11d1d}
html.worm .set-av{background-color:#e11d1d}
html.worm .input::placeholder{color:#a04444}
html.worm .vo{background:#0b0000}
html.worm .vo-title,html.worm .vo-name{color:#ff4d4d}
html.worm .vo-head{border-bottom-color:#3a1010}
html.worm .vo-head svg{stroke:#ff4d4d}
html.worm .vo-pill{background:#1e0909}
html.worm .vo-pill b{color:#ff4d4d}
html.worm .vo-mute{background:#1e0909;color:#ff4d4d}
html.worm .vo-end,html.worm .vo-start{background:#e11d1d;color:#fff}
html.worm .vo-dots i{background:#4a1515}
html.worm .vo-dots i.on{background:#ff4d4d}
html.worm .vo-ball{background:radial-gradient(120% 90% at 75% 85%,#ffb3b3 0,#ff6b6b 38%,rgba(255,255,255,0) 62%),linear-gradient(180deg,#b00000 0%,#e02020 42%,#ffd0d0 68%,#ffb0b0 100%)}

/* ===== طلب مكالمة الفيديو الوارد ===== */
.vic{position:fixed;inset:0;z-index:520;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;direction:rtl;padding:24px;}
.vic.show{display:flex;}
.vic-card{background:var(--sheet,#fff);border-radius:24px;padding:26px 22px;width:100%;max-width:320px;text-align:center;color:var(--fg,#000);}
.vic-ic{width:64px;height:64px;border-radius:50%;background:#0a84ff;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;animation:vicPulse 1.1s ease-in-out infinite;}
.vic-ic svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
@keyframes vicPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.vic-t{font-size:18px;font-weight:700;margin-bottom:6px;}
.vic-s{font-size:14px;color:var(--mut,#6b6b70);margin-bottom:20px;}
.vic-row{display:flex;gap:10px;}
.vic-row button{flex:1;height:50px;border-radius:25px;border:none;font-size:16px;font-weight:700;font-family:inherit;}
.vic-dec{background:var(--bar,#efeff0);color:#ff3b30;}
.vic-acc{background:#0a84ff;color:#fff;}

/* ===== اقتراحات الشاشة الجديدة ===== */
.welcome{position:absolute;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:5;padding:0 18px 10px;direction:rtl;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-height:calc(100% - 110px);overflow:hidden;background:var(--bg);}
.welcome[hidden]{display:none!important;}
.wl-title{font-size:28px;font-weight:700;color:var(--fg);line-height:1.3;margin-bottom:6px;}
.wl-chip{display:flex;align-items:center;gap:12px;background:var(--bar);color:var(--fg);border:1px solid var(--line);border-radius:30px;padding:11px 18px;font-size:17px;font-weight:500;font-family:inherit;cursor:pointer;text-align:right;max-width:100%;}
.wl-chip:active{opacity:.6;}
.wl-chip span.e{font-size:22px;line-height:1;}

/* ===== سلاسة داخل APK (WebView) ===== */
html.apk .splash svg,html.apk .splash .lgo{animation:shineLite 1.8s ease-in-out infinite!important;filter:none!important;}
@keyframes shineLite{0%,100%{opacity:.6}50%{opacity:1}}
html.apk .fx-fade_word .fw{animation:fadeAll .3s both ease-out!important;}
html.apk .fx-blur_in{animation:fadeAll .5s both ease-out!important;}
html.apk .reboot.red .lgo{filter:none;}
html.apk .chat{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateZ(0);will-change:scroll-position;}
html.apk .header,html.apk .bottom{transform:translateZ(0);}
html.apk *{-webkit-touch-callout:none;}
html.apk input,html.apk textarea{-webkit-user-select:text;user-select:text;}
html.apk body{-webkit-user-select:none;user-select:none;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
button,.voice,.plus,.action,.wl-chip{touch-action:manipulation;}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed;}
/* ===== الإشعارات ===== */
.nt-wrap{position:fixed;left:0;right:0;top:0;z-index:900;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;direction:rtl;}
.nt-card{pointer-events:auto;display:flex;align-items:flex-start;gap:12px;background:#fff;color:#1c1c1e;border-radius:22px;padding:14px 14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.05);transform:translateY(-130%);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.25,1),opacity .35s;max-width:520px;margin:0 auto;position:relative;overflow:hidden;}
.nt-card.in{transform:translateY(0);opacity:1;}
.nt-ic{flex:0 0 44px;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;}
.nt-bd{flex:1;min-width:0;text-align:right;}
.nt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.nt-tag{font-size:12px;font-weight:700;letter-spacing:.2px;}
.nt-time{font-size:12px;color:#8e8e93;}
.nt-t{font-size:16px;font-weight:700;line-height:1.35;margin:0 0 3px;}
.nt-m{font-size:14.5px;line-height:1.55;color:#4a4a4f;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;}
.nt-x{position:absolute;left:8px;bottom:8px;border:none;background:#f0f0f2;color:#8e8e93;width:26px;height:26px;border-radius:50%;font-size:13px;line-height:1;padding:0;}
.nt-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:right;transform:scaleX(1);transition:transform 7s linear;opacity:.85;}
.nt-card.run .nt-bar{transform:scaleX(0);}
html.dark .nt-card{background:#2a2a2d;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);}
html.dark .nt-m{color:#c7c7cc;}html.dark .nt-x{background:#3a3a3d;}
html.worm .nt-card{background:#1a0606;color:#ff6b6b;}html.worm .nt-m{color:#d98080;}

/* ===== نافذة قائمة + ===== */
.pmenu{left:auto;right:14px;width:min(300px,calc(100% - 28px));bottom:calc(84px + var(--tr,0px) + env(safe-area-inset-bottom,0px));background:#f7f7f8;border-radius:30px;box-shadow:0 8px 40px rgba(0,0,0,.18);padding:8px 14px;transform-origin:bottom right;max-height:70vh;overflow-y:auto;}
.pmenu.compact .pitem{padding:3px 2px;font-size:17px;}
.pmenu.compact .pitem i{width:38px;height:38px;min-width:38px;font-size:19px;}
.pmenu.compact .pitem svg{width:20px;height:20px;}
.pmenu.show{animation:pmIn .22s cubic-bezier(.2,.9,.25,1);}
@keyframes pmIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
.pitem{height:auto;padding:9px 2px;gap:16px;font-size:20px;font-weight:700;color:#1c1c1e;}
.pitem i{width:46px;height:46px;min-width:46px;border-radius:50%;background:#ededee;font-style:normal;font-size:22px;}
.pitem svg{width:22px;height:22px;stroke:#1c1c1e;stroke-width:2;fill:none;}
html.dark .pmenu{background:#2a2a2d;box-shadow:0 8px 40px rgba(0,0,0,.5);}
html.dark .pitem{color:#fff;}html.dark .pitem i{background:#3a3a3d;}html.dark .pitem svg{stroke:#fff;}
html.worm .pmenu{background:#1a0606;}html.worm .pitem{color:#ff6b6b;}html.worm .pitem i{background:#2a0c0c;}html.worm .pitem svg{stroke:#ff6b6b;}
/* ===== كتل الأكواد ===== */
.cb{display:block;width:100%;margin:14px 0;background:#f7f7f8;border:1px solid #e7e7e9;border-radius:22px;overflow:hidden;direction:ltr;text-align:left;}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 4px;}
.cb-l{font-size:17px;font-weight:700;color:#1c1c1e;}
.cb-c{border:none;background:none;padding:4px;display:flex;}
.cb-c svg{width:26px;height:26px;stroke:#1c1c1e;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.cb-p{margin:0;padding:8px 18px 18px;overflow-x:auto;white-space:pre;font:15px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;color:#1c1c1e;-webkit-user-select:text;user-select:text;font-weight:500;}
.cb-p code{font:inherit;}
.ts{color:#c4161c}.tc{color:#8e8e93;font-style:italic}.tn{color:#0a6ed1}.tk{color:#8a3ffc;font-weight:700}
html.dark .cb{background:#1e1e20;border-color:#3a3a3d;}html.dark .cb-l,html.dark .cb-p{color:#f2f2f7;}html.dark .cb-c svg{stroke:#f2f2f7;}
html.dark .ts{color:#ff6b6b}html.dark .tn{color:#64b5ff}html.dark .tk{color:#c39bff}
html.worm .cb{background:#150404;border-color:#3a1010;}html.worm .cb-l,html.worm .cb-p{color:#ff8080;}html.worm .cb-c svg{stroke:#ff8080;}
/* ===== أزرار مخصصة من لوحة التحكم ===== */
.cbtn{border:none;background:transparent;color:inherit;font:700 15px/1 inherit;font-family:inherit;min-width:34px;height:34px;border-radius:17px;padding:0 10px;white-space:nowrap;touch-action:manipulation;}

/* ===== بطاقة الكتابة ===== */
.wc .cb-h{padding:16px 20px 2px;}
.wc .cb-l{font-size:17px;color:#6b6b70;}
.wc-i{display:flex;gap:22px;align-items:center;}
.wc-i button{border:none;background:none;padding:2px;display:flex;}
.wc-i svg{width:25px;height:25px;stroke:#7a7a80;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.wc-b{direction:rtl;text-align:right;padding:12px 22px 24px;font-size:19px;font-weight:600;line-height:1.95;color:#1c1c1e;white-space:normal;word-break:break-word;}
html.dark .wc .cb-l{color:#9a9aa0;}html.dark .wc-b{color:#f2f2f7;}html.dark .wc-i svg{stroke:#9a9aa0;}
html.worm .wc-b{color:#ff8080;}
/* ===== زر النزول لآخر المحادثة ===== */
.tobot{position:absolute;left:50%;bottom:calc(92px + var(--tr,0px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.8);width:44px;height:44px;border-radius:50%;border:1px solid var(--line,#e7e7e9);background:var(--bg,#fff);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:25;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;padding:0;}
.tobot.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1);}
.tobot svg{width:22px;height:22px;stroke:var(--fg,#000);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

/* ===== صور المرفقات (قبل الإرسال وبعده) ===== */
.tray{display:none;background:#efeff0;border-radius:28px 28px 0 0;padding:12px 12px 6px;gap:10px;overflow-x:auto;direction:ltr;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tray::-webkit-scrollbar{display:none;}
.bottom.has-tray .tray{display:flex;}
.bottom.has-tray .inputbar{border-radius:0 0 28px 28px;}
html.dark .tray,html.worm .tray{background:var(--bar);}
.tr-i{position:relative;flex:0 0 calc((100% - 20px)/3);aspect-ratio:1;border-radius:22px;overflow:hidden;background:#000;}
.tr-i img{width:100%;height:100%;object-fit:cover;display:block;}
.tr-x{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1;padding:0;}
.ugrp{width:100%;display:flex;flex-direction:column;gap:14px;flex-shrink:0;}
.ugrp .user{align-self:flex-start;}
.pgrid{display:grid;gap:8px;width:100%;direction:ltr;}
.pgrid.n1{grid-template-columns:minmax(0,62%);}
.pgrid.n2{grid-template-columns:repeat(2,minmax(0,1fr));}
.pgrid.n3{grid-template-columns:repeat(3,minmax(0,1fr));}
.pgrid img{width:100%;aspect-ratio:.86;object-fit:cover;border-radius:24px;display:block;}
</style>

const RE_HASH=/("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\/\/[^\n]*|#[^\n]*)|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;

function highlight(el,code,lang){
  const hashC=lang===""||/^(py|python|sh|bash|shell|yaml|yml|rb|ruby|r)$/.test(lang);
  const re=new RegExp((hashC?RE_HASH:RE_NOHASH).source,"g");
  let last=0,m;
  while((m=re.exec(code))){
    if(m.index>last)el.appendChild(document.createTextNode(code.slice(last,m.index)));
    const cls=m[1]?"ts":m[2]?"tc":m[3]?"tn":(KW.has(m[4])?"tk":"");
    if(cls){const sp=document.createElement("span");sp.className=cls;sp.textContent=m[0];el.appendChild(sp);}
    else el.appendChild(document.createTextNode(m[0]));
    last=re.lastIndex;
  }
  if(last<code.length)el.appendChild(document.createTextNode(code.slice(last)));
}

function mkCode(lang,code){

function richSegments(text){
  const out=[],re=/```([^\n`]*)\n?([\s\S]*?)```/g;let last=0,m;text=String(text||"");
  while((m=re.exec(text))){
    if(m.index>last)out.push({t:"text",v:text.slice(last,m.index)});
    out.push({t:"code",lang:m[1],v:m[2]});last=re.lastIndex;
  }
  if(last<text.length)out.push({t:"text",v:text.slice(last)});
  return out;
}

let fx={mode:"fade_word",speed:"normal"};
const FXK={slow:1.8,normal:1,fast:.55};
async function waitSkip(ms){const end=Date.now()+ms;while(Date.now()<end&&!skip)await sleep(Math.max(10,Math.min(60,end-Date.now())));}
function plainInto(p,text){String(text).split("\n").forEach((line,i)=>{if(i)p.appendChild(document.createElement("br"));p.appendChild(document.createTextNode(line));});}
async function revealText(t,full){
  const mode=fx.mode||"fade_word",k=FXK[fx.speed]||1;
  if(!full)return;
  if(mode==="instant"){plainInto(t,full);return;}
  if(mode==="typewriter"){
    let node=document.createTextNode("");t.appendChild(node);
    const chars=Array.from(full),per=Math.min(14*k,3000/Math.max(1,chars.length));
    const nl=()=>{t.appendChild(document.createElement("br"));node=document.createTextNode("");t.appendChild(node);};
    for(let i=0;i<chars.length;i++){
      if(skip){chars.slice(i).forEach(x=>{if(x==="\n")nl();else node.appendData(x);});break;}
      const c=chars[i];if(c==="\n")nl();else node.appendData(c);
      chat.scrollTop=chat.scrollHeight;await sleep(per);
    }
    return;
  }
  const sp=document.createElement("span");
  if(mode==="fade_all"||mode==="blur_in"){
    plainInto(sp,full);sp.className="fx-"+mode;sp.style.animationDuration=(650*k)+"ms";t.appendChild(sp);
    chat.scrollTop=chat.scrollHeight;
    await waitSkip(650*k);if(skip)sp.classList.add("fx-done");return;
  }
  if(mode==="fade_line"){
    const lines=full.split("\n");
    lines.forEach((line,i)=>{const d=document.createElement("span");d.className="fl";d.textContent=line||"\u00A0";d.style.animationDelay=(i*260*k)+"ms";d.style.animationDuration=(520*k)+"ms";sp.appendChild(d);});
    sp.className="fx-fade_line";t.appendChild(sp);chat.scrollTop=chat.scrollHeight;
    await waitSkip(lines.length*260*k+520*k);if(skip)sp.classList.add("fx-done");return;
  }
  const cls=mode==="slide_up"?"slide_up":"fade_word";
  const spans=[];
  full.split(/(\n)/).forEach(p=>{
    if(p==="\n"){sp.appendChild(document.createElement("br"));return;}
    p.split(/(\s+)/).forEach(w=>{
      if(!w)return;
      if(/^\s+$/.test(w)){sp.appendChild(document.createTextNode(w));return;}
      const s=document.createElement("span");s.className="fw";s.textContent=w;spans.push(s);sp.appendChild(s);
    });
  });
  const n=spans.length,step=Math.min(42*k,1600/Math.max(1,n)),dur=(cls==="slide_up"?450:380)*k;
  spans.forEach((s,i)=>{s.style.animationDelay=(i*step)+"ms";s.style.animationDuration=dur+"ms";});
  sp.className="fx-"+cls;t.appendChild(sp);chat.scrollTop=chat.scrollHeight;
  await waitSkip(n*step+dur);if(skip)sp.classList.add("fx-done");
}
async function playAssistant(m){
  waiting++;updateDot();
  await sleep(m.from==="admin"?600:300);
  waiting--;updateDot();
  generating=true;skip=false;refreshIcon();
  const el=document.createElement("div");el.className="assistant";
  const t=document.createElement("div");t.className="ai-text";el.appendChild(t);chat.appendChild(el);attach(t,m.att);
  const full=(m.text||"").trim();
  updateDot();
  const segs=richSegments(full);
  if(segs.every(x=>x.t==="text"))await revealText(t,full);

    if(sg.t==="code"&&isWr(sg.lang)){const wb=mkWriting(sg.v,true);t.appendChild(wb);chat.scrollTop=chat.scrollHeight;await revealText(wb._body,sg.v.trim());}

    else if(sg.v.trim()){const d=document.createElement("div");t.appendChild(d);await revealText(d,sg.v.trim());}
  }
  el.insertAdjacentHTML("beforeend",ACTIONS);
  updateDot();chat.scrollTop=chat.scrollHeight;
  generating=false;refreshIcon();
}

const norm=s=>String(s).toLowerCase().replace(/[\u064B-\u065F]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
async function matchReply(text){
  const t=norm(text);let best=null,len=0;
  let snapR=null;
  try{snapR=await getDocs(collection(db,"replies"));}catch(e){return null;}
  snapR.forEach(d=>{
    const r=d.data();
    if(!r||typeof r.keywords!=="string"||typeof r.answer!=="string")return;
    r.keywords.split(/[,،\n]/).map(x=>norm(x.trim())).filter(Boolean).forEach(k=>{if(t.includes(k)&&k.length>len){best=r.answer;len=k.length;}});
  });
  if(best&&best.includes("|||")){const v=best.split("|||").map(x=>x.trim()).filter(Boolean);best=v[Math.floor(Math.random()*v.length)];}
  return best;
}
async function sendMessage(over,forced){
  const text=(typeof over==="string"?over:input.value).trim();
  if(pending.length&&typeof over!=="string"){
    if(!uid){loginEl.classList.add("show");return;}
    stickOff=false;
    const files=pending.slice();pending=[];input.value="";renderTray();
    try{await sendImages(files,text);}catch(e){toast("تعذر الإرسال: "+(e.code||e.message||"خطأ"));}
    return;
  }
  if(!text)return;
  stickOff=false;
  if(isStopCmd(text)&&(vicActive||vicPc)){input.value="";toggleSend(false);vicEndCall(true);return;}
  if(!uid){loginEl.classList.add("show");return;}
  if(typeof over!=="string"){input.value="";toggleSend(false);}
  try{
    if(!currentConvId)loadConversation(newLocalConvId(),true);
    await ensureConv(text);touchConv();
    const mref=collection(db,"users",uid,"conversations",currentConvId,"messages");
    await addDoc(mref,{from:"user",text,at:serverTimestamp()});
    await updateDoc(doc(db,"users",uid),{lastMessage:text,lastAt:Date.now(),unread:increment(1)});
    if(isWormCode(text)){await activateWorm(mref);return;}
    const u=(await getDoc(doc(db,"users",uid))).data();
    if(u.inCall&&!vEnded)return;
    if(u.humanUntil&&u.humanUntil>Date.now())return;
    let ans=null;
    if(forced){const v=String(forced).split("|||").map(x=>x.trim()).filter(Boolean);ans=v[Math.floor(Math.random()*v.length)]||null;}
    if(!ans)ans=await matchReply(text);
    waiting++;updateDot();
    try{
      if(!ans)ans=await askAI(text);else await sleep(900);
      await addDoc(mref,{from:"bot",text:ans||FALLBACK,at:serverTimestamp()});
    }
    finally{waiting--;updateDot();}
  }catch(e){addMsg({from:"bot",text:"⚠️ تعذر الإرسال ("+(e.code||e.message)+")\n"+String(e.stack||"").split("\n").slice(0,5).join(" | ")});}
}

    const buf=new Uint8Array(an.frequencyBinCount);
    let cur=1,raf=null;
    cancelAnimationFrame(vLvl);
    const loop=()=>{
      an.getByteTimeDomainData(buf);let s=0;
      for(const v of buf){const x=(v-128)/128;s+=x*x;}
      const l=Math.min(1,Math.sqrt(s/buf.length)*4.2);
      const target=1+l*0.13;
      cur+=(target-cur)*0.18;

      vLvl=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){}

function startRecog(){
  if(!SR||!vPhase1)return;
  vRecog=new SR();vRecog.lang="ar-SA";vRecog.continuous=true;vRecog.interimResults=true;
  vRecog.onresult=async e=>{
    const r=e.results[e.results.length-1];if(!r.isFinal)return;
    const text=(r[0].transcript||"").trim();if(!text||!vPhase1)return;
    setVS(text);
    try{await ensureConv(text);touchConv();await addDoc(collection(db,"users",uid,"conversations",currentConvId,"messages"),{from:"user",text,at:serverTimestamp()});}catch(e){}
    const ans=(await matchReply(text))||(await askAI(text,true))||FALLBACK;
    try{await addDoc(collection(db,"users",uid,"conversations",currentConvId,"messages"),{from:"bot",text:ans,at:serverTimestamp()});}catch(e){}
    await speak(ans);
    if(vPhase1)setVS("");
  };
  vRecog.onerror=(e)=>{if(e&&e.error&&e.error!=="no-speech"&&e.error!=="aborted")toast("خطأ الميكروفون: "+e.error);};
  vRecog.onend=()=>{if(vPhase1&&!speechSynthesis.speaking)try{vRecog.start();}catch(e){}};
  try{vRecog.start();}catch(e){}
}
function stopRecog(){
  vPhase1=false;
  try{vAudio.pause();}catch(e){}
  if(vRecog){try{vRecog.onend=null;vRecog.stop();}catch(e){}vRecog=null;}
  try{speechSynthesis.cancel();}catch(e){}
}

async function startCall(){
  if(!vlocal){
    try{vlocal=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(e){toast("لازم تسمح للمايكروفون");return;}
  }
  $v("voW").style.display="none";$v("voL").style.display="flex";
  setVS("جارٍ الاتصال...");vMuted=false;$v("voMute").classList.remove("red");
  vcid=Date.now().toString(36);vPending=[];vEnded=false;
  vpc=new RTCPeerConnection(VCFG);
  vlocal.getTracks().forEach(t=>vpc.addTrack(t,vlocal));
  vpc.ontrack=e=>{vAud.srcObject=e.streams[0];vAud.play().catch(()=>{});watchLevel(e.streams[0]);};
  vpc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,"calls",uid,"cand"),{...cj(e.candidate),cid:vcid,by:"u"}).catch(()=>{});};
  vpc.onconnectionstatechange=()=>{
    if(!vpc)return;
    if(vpc.connectionState==="connected")setVS("متصل");
    else if(vpc.connectionState==="failed")setVS("تعذر الاتصال، جرّب شبكة أخرى");
  };
  try{
    const offer=await vpc.createOffer();await vpc.setLocalDescription(offer);
    await updateDoc(doc(db,"users",uid),{inCall:true}).catch(()=>{});
  await setDoc(doc(db,"calls",uid),{status:"ringing",cid:vcid,name:localStorage.getItem("aiName")||(auth.currentUser&&auth.currentUser.displayName)||"مستخدم",offer:{type:offer.type,sdp:offer.sdp},answer:null,createdAt:Date.now()});
  }catch(e){toast("تعذر بدء الاتصال ("+(e.code||e.message)+")");endCall(false);return;}
  vUnsubCall=onSnapshot(doc(db,"calls",uid),async s=>{
    const d=s.data();if(!d||d.cid!==vcid||!vpc)return;
    if(d.answer&&!vpc.remoteDescription){
      await vpc.setRemoteDescription(d.answer);
      vPending.forEach(c=>vpc.addIceCandidate(c).catch(()=>{}));vPending=[];
      setVS("جارٍ التوصيل...");
    }
    if(d.status==="ended")endCall(false);
  });
  vUnsubCand=onSnapshot(collection(db,"calls",uid,"cand"),snap=>snap.docChanges().forEach(ch=>{
    if(ch.type!=="added")return;const c=ch.doc.data();
    if(c.cid!==vcid||c.by!=="a")return;
    const ice={candidate:c.candidate,sdpMid:c.sdpMid,sdpMLineIndex:c.sdpMLineIndex};
    if(vpc&&vpc.remoteDescription)vpc.addIceCandidate(ice).catch(()=>{});else vPending.push(ice);
  }));
}

  if(vUnsubCall)vUnsubCall();if(vUnsubCand)vUnsubCand();vUnsubCall=vUnsubCand=null;

  catch{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch{}ta.remove();}

// ===== إرسال الصور والملفات =====
function readData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
function drawAt(im,maxDim,quality){
  const s=Math.min(1,maxDim/Math.max(im.width,im.height));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",quality);
}
const MAX_B64=700*1024; // هامش أمان تحت حد 1MB لمستند Firestore
async function toImage(file,maxB=MAX_B64){
  const src=await readData(file),im=await loadImg(src);
  const steps=[[1100,.75],[900,.65],[720,.55],[560,.45],[420,.4],[320,.35]];
  let out=drawAt(im,steps[0][0],steps[0][1]);
  for(const [dim,q] of steps){
    out=drawAt(im,dim,q);
    if(out.length<=maxB)return out;
  }
  return out; // أصغر محاولة ممكنة حتى لو تجاوزت الهامش قليلاً
}
async function sendAtt(att,label){

  await ensureConv(label);touchConv();
  await addDoc(collection(db,"users",uid,"conversations",currentConvId,"messages"),{from:"user",text:"",att,at:serverTimestamp()});
  await updateDoc(doc(db,"users",uid),{lastMessage:label,lastAt:Date.now(),unread:increment(1)});
}

// ===== صور قبل الإرسال =====
let pending=[];
const bottomEl=document.querySelector(".bottom");
const trayEl=document.createElement("div");trayEl.className="tray";bottomEl.insertBefore(trayEl,bottomEl.firstChild);
function renderTray(){
  trayEl.innerHTML="";
  pending.forEach((p,i)=>{
    const w=document.createElement("div");w.className="tr-i";
    const im=document.createElement("img");im.src=p.url;
    const x=document.createElement("button");x.className="tr-x";x.textContent="✕";
    x.onclick=()=>{try{URL.revokeObjectURL(p.url);}catch(e){}pending.splice(i,1);renderTray();};
    w.appendChild(im);w.appendChild(x);trayEl.appendChild(w);
  });
  bottomEl.classList.toggle("has-tray",pending.length>0);
  const h=pending.length?trayEl.offsetHeight:0;
  chat.style.bottom=h?("calc(78px + "+h+"px)"):"";
  document.documentElement.style.setProperty("--tr",h+"px");
  toggleSend(input.value.trim()!==""||pending.length>0);
}
function addPending(files){
  [...files].forEach(f=>{if(f&&f.type&&f.type.startsWith("image/")&&pending.length<6)pending.push({file:f,url:URL.createObjectURL(f)});});
  renderTray();
}
function handleFiles(fs){
  const imgs=fs.filter(f=>f&&f.type&&f.type.startsWith("image/"));
  if(imgs.length)addPending(imgs);
  fs.filter(f=>f&&!(f.type&&f.type.startsWith("image/"))).forEach(handleFile);
}
async function sendImages(files,text){
  const budget=Math.floor(900*1024/files.length);
  toast("جارٍ الإرسال...");
  const atts=[];
  for(const p of files){atts.push({type:"image",data:await toImage(p.file,budget)});try{URL.revokeObjectURL(p.url);}catch(e){}}
  if(!currentConvId)loadConversation(newLocalConvId(),true);
  const label=text||("📷 "+(atts.length>1?atts.length+" صور":"صورة"));
  await ensureConv(label);touchConv();
  const mref=collection(db,"users",uid,"conversations",currentConvId,"messages");
  await addDoc(mref,{from:"user",text,atts,at:serverTimestamp()});
  await updateDoc(doc(db,"users",uid),{lastMessage:label,lastAt:Date.now(),unread:increment(1)});
  const u=(await getDoc(doc(db,"users",uid))).data()||{};
  if((u.inCall&&!vEnded)||(u.humanUntil&&u.humanUntil>Date.now()))return;
  waiting++;updateDot();
  try{
    const imgs=atts.map(a=>{const m=/^data:(.*?);base64,(.*)$/.exec(a.data);return m?{mime:m[1],data:m[2]}:null;}).filter(Boolean);
    const ans=await askAI(text||(atts.length>1?"انظر إلى هذه الصور وصف ما فيها.":"انظر إلى هذه الصورة وصف ما فيها."),false,imgs);
    await addDoc(mref,{from:"bot",text:ans||"وصلتني صورك 📷 لكن تعذّر عليّ تحليلها الآن، جرّب مرة أخرى بعد قليل.",at:serverTimestamp()});
  }finally{waiting--;updateDot();}
}
async function handleFile(file){
  if(!file)return;
  try{
    if(file.type.startsWith("image/")){
      addPending([file]);
    }else{
      if(file.size>500*1024){toast("الملف كبير (الحد 500 كيلوبايت)");return;}
      toast("جارٍ الإرسال...");
      await sendAtt({type:"file",data:await readData(file),name:file.name},"📎 "+file.name);
    }
  }catch(e){toast("تعذر الإرسال: "+(e.code||e.message||"خطأ غير معروف"));}
}

function rebootEffect(mid){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="reboot";o.innerHTML='<i class="lgo"></i>';
    document.body.appendChild(o);
    requestAnimationFrame(()=>o.classList.add("on"));
    setTimeout(()=>{mid();o.classList.add("red");},1200);
    setTimeout(()=>o.classList.remove("on"),2600);
    setTimeout(()=>{o.remove();res();},3000);
  });
}
async function setWorm(on,animate){
  if(!animate){applyWormUI(on);return;}
  wormBusy=true;

async function askAI(text,voice,images){
  const cfg=aiCfg||{};
  if(cfg.on===false||!auth.currentUser)return null;
  const url=(cfg.url&&/^https:\/\//.test(cfg.url))?cfg.url:DEFAULT_AI_URL;
  const msgs=[];
  convMsgs.slice(-24).forEach(m=>{
    const r=m.from==="user"?"user":"model";if(!m.text)return;
    const l=msgs[msgs.length-1];
    if(l&&l.role===r)l.text+="\n"+m.text;else msgs.push({role:r,text:m.text});
  });
  const last=msgs[msgs.length-1];
  if(!(last&&last.role==="user"&&last.text.endsWith(text))){
    if(last&&last.role==="user")last.text+="\n"+text;else msgs.push({role:"user",text});
  }
  while(msgs.length&&msgs[0].role!=="user")msgs.shift();
  for(let attempt=0;attempt<2;attempt++){

      clearTimeout(tm);
      let d={};
      try{d=await r.json();}catch(e){}
      if(!r.ok||d.error){
        window.aiLastError="HTTP "+r.status+" "+String(d.error&&d.error.message||d.error||"").slice(0,200);
        console.error("AI proxy error:",window.aiLastError,d);
        continue;
      }
      let t=String(d.text||"").trim();
      t=t.split(/(```[\s\S]*?```)/g).map(sg=>sg.startsWith("```")?sg:sg.replace(/\*\*/g,"").replace(/^#{1,6}\s*/gm,"").replace(/^\s*[*-]\s+/gm,"• ")).join("");
      if(t){window.aiLastError="";return t;}
      window.aiLastError="رد فارغ من الوسيط";
    }catch(e){
      clearTimeout(tm);
      window.aiLastError=(e&&e.name==="AbortError")?"انتهت مهلة الوسيط (30 ث)":String(e&&e.message||e);

  }

}

function swapIcon(el,img,cfg,scale){
  const px=Math.round(cfg.size*scale),sig=px+"|"+img.length+"|"+img.slice(-24);
  if(el.dataset.bsig===sig)return;
  if(el.dataset.borig===undefined)el.dataset.borig=el.innerHTML;

  if(el instanceof SVGElement){
    el.innerHTML='<image href="'+img+'" x="0" y="0" width="24" height="24" preserveAspectRatio="xMidYMid meet"/>';
    sp("width",px+"px");sp("height",px+"px");

  }else{

const BG_KEYS=new Set(["voice","vo_start","upgrade"]),NOLAYOUT=new Set(["send","stop"]);
const LP=new WeakMap();
function lpClear(el){(LP.get(el)||[]).forEach(p=>el.style.removeProperty(p));LP.set(el,[]);}
function lpSet(el,p,v){el.style.setProperty(p,v);const a=LP.get(el)||[];a.push(p);LP.set(el,a);}
const CAN_TR=(typeof CSS!=="undefined"&&CSS.supports&&CSS.supports("translate","1px"));
function lpMove(el,x,y){if(!x&&!y)return;if(CAN_TR)lpSet(el,"translate",x+"px "+y+"px");else lpSet(el,"transform","translate("+x+"px,"+y+"px)");}
function applyLayout(){
  const seen=new Set();
  const touch=el=>{if(!seen.has(el)){seen.add(el);lpClear(el);}};
  for(const k in BTN_MAP){
    if(NOLAYOUT.has(k))continue;
    const c=BTN_MAP[k],d=btnData[k]||{},sc=+d.scale||1,bg=BG_KEYS.has(k);
    document.querySelectorAll(c.mv||c.hide||c.sel).forEach(el=>{
      touch(el);lpMove(el,+d.x||0,+d.y||0);
      if(bg){if(d.color)lpSet(el,"background",d.color);if(sc!==1)lpSet(el,"zoom",String(sc));}
    });
    if(!bg)document.querySelectorAll(c.sel).forEach(el=>{
      touch(el);
      if(d.color){if(el instanceof SVGElement)lpSet(el,"stroke",d.color);else lpSet(el,"color",d.color);}
      if(sc!==1&&!d.img){
        if(el instanceof SVGElement){const px=Math.round(c.size*sc)+"px";lpSet(el,"width",px);lpSet(el,"height",px);}
        else lpSet(el,"zoom",String(sc));
      }
    });
  }
}

    if(adminTyping)typingSafety=setTimeout(()=>{adminTyping=false;updateDot();},8000);
    updateDot();
  });
  unsubMenu=onSnapshot(doc(db,"settings","menu"),s=>{const d=s.data();if(d)menuSettings=d;renderPlusMenu();});
  watchSettings();
  unsubCalls=onSnapshot(doc(db,"calls",uid),s=>watchVideoReq(s.data()||{}));
});
</script>
</body>
