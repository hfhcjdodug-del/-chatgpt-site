<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ChatGPT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;margin:0;padding:0;background:#fff;color:#000;overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;}
body{position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

/* HEADER */
.header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:52px;
display:flex;align-items:center;z-index:20;background:#fff;
border-bottom:1px solid #e7e7e9;padding:0 16px;direction:ltr;}
.header-spacer{flex:1;}
.header-title{font-size:19px;font-weight:700;letter-spacing:-0.3px;color:#1c1c1e;}
.header-left{display:flex;align-items:center;flex-direction:row;gap:22px;direction:ltr;flex:0 0 auto;}
.header-right-group{display:flex;align-items:center;gap:10px;direction:ltr;flex:0 0 auto;}
.header-icon{width:22px;height:22px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.dots{width:20px;height:20px;fill:#000;stroke:none;}

/* CHAT */
.chat{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:0;right:0;
bottom:78px;overflow-y:auto;overflow-x:hidden;padding:24px 18px 20px;display:flex;
flex-direction:column;gap:28px;direction:ltr;scrollbar-width:none;background:#fff;}
.chat::-webkit-scrollbar{display:none;}

/* USER MESSAGE */
.user{align-self:flex-start;max-width:78%;padding:13px 20px;background:#e8f3ff;
border-radius:20px;color:#1173d4;font-size:17px;font-weight:500;line-height:1.4;
direction:rtl;flex-shrink:0;}

/* ASSISTANT */
.assistant{align-self:flex-start;width:100%;color:#000;font-size:17px;font-weight:500;
line-height:1.6;text-align:right;direction:rtl;}
.ai-text{display:block;width:100%;}

/* ACTIONS */
.actions{width:100%;margin-top:12px;display:flex;justify-content:flex-end;
align-items:center;gap:24px;direction:ltr;}
.action{width:22px;height:22px;stroke:#6b6b70;fill:none;stroke-width:2.1;
stroke-linecap:round;stroke-linejoin:round;}
.dots-action{font-size:20px;font-weight:700;color:#6b6b70;letter-spacing:1px;line-height:1;}

/* BOTTOM INPUT */
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));
background:#fff;z-index:30;}
.inputbar{width:100%;height:56px;background:#efeff0;border-radius:28px;display:flex;
align-items:center;direction:ltr;padding:5px 6px 5px 3px;gap:12px;overflow:visible;}
.voice{width:48px;height:48px;min-width:48px;border-radius:50%;background:#0a84ff;
display:flex;align-items:center;justify-content:center;cursor:pointer;
box-shadow:0 0 0 4px #efeff0;margin-left:2px;}
.voice svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;}
.voice .wave-icon{display:flex;}
.voice .send-icon{display:none;}
.mic{width:25px;height:25px;min-width:25px;fill:none;stroke:#000;stroke-width:2;
stroke-linecap:round;stroke-linejoin:round;}
.input{min-width:0;flex:1;width:0;border:none;outline:none;background:transparent;
color:#000;font-family:inherit;font-size:17px;font-weight:600;text-align:right;
direction:rtl;white-space:nowrap;overflow:hidden;text-overflow:clip;}
.input::placeholder{color:#9a9a9e;opacity:1;}
.plus{width:28px;min-width:28px;height:28px;display:flex;align-items:center;
justify-content:center;color:#000;font-size:28px;font-weight:300;line-height:1;}

/* LOGIN */
.login{position:fixed;inset:0;z-index:100;background:#fff;display:none;align-items:center;justify-content:center;padding:24px;direction:rtl;}
.login.show{display:flex;}
.login-card{width:100%;max-width:340px;text-align:center;}
.login-card h1{font-size:26px;margin:0 0 6px;color:#1c1c1e;}
.login-card p{color:#6b6b70;margin:0 0 26px;font-size:15px;}
.login-card input{width:100%;height:52px;border:none;background:#efeff0;border-radius:26px;padding:0 20px;font-size:17px;font-family:inherit;text-align:right;outline:none;margin-bottom:12px;}
.login-card button{width:100%;height:52px;border:none;border-radius:26px;background:#0a84ff;color:#fff;font-size:17px;font-weight:600;font-family:inherit;}
.login-or{margin:18px 0;color:#9a9a9e;font-size:14px;}
#gbtn{display:flex;justify-content:center;}
.login-err{color:#d70015;font-size:14px;min-height:20px;margin-top:10px;}

/* إصلاح الكيبورد على iOS */
html{height:100%;overflow:hidden;}
body{position:fixed;top:0;left:0;width:100%;height:var(--vh,100%);}

/* النقطة الزرقاء + ظهور الكلمات تدريجياً */
.dotwrap{align-self:flex-start;width:100%;display:flex;justify-content:flex-end;padding:4px 4px 0;}
.tdot{width:16px;height:16px;border-radius:50%;background:#3399ff;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.w{opacity:0;filter:blur(3px);transition:opacity .9s ease,filter .9s ease;}
.w.on{opacity:1;filter:none;}
.voice .stop-icon{display:none;width:18px;height:18px;background:#fff;border-radius:4px;}

.pic{display:block;max-width:100%;max-height:320px;border-radius:14px;margin:0 0 8px;}
.assistant .pic{margin-left:auto;}
.fcard{display:block;color:inherit;text-decoration:underline;font-size:15px;margin-bottom:6px;}
.action{padding:8px;margin:-8px;box-sizing:content-box;cursor:pointer;}
.action.liked{stroke:#0a84ff;}
.w{transition:opacity 1.4s cubic-bezier(.22,.61,.36,1),filter 1.4s cubic-bezier(.22,.61,.36,1)!important;filter:blur(4px);}
.pmenu{position:absolute;right:14px;bottom:84px;width:min(310px,calc(100% - 28px));background:#f7f7f8;border-radius:30px;box-shadow:0 8px 40px rgba(0,0,0,.18);padding:10px 12px;direction:rtl;display:none;z-index:60;}
.pmenu.show{display:block;}
.pitem{display:flex;align-items:center;gap:16px;padding:10px 6px;cursor:pointer;font-size:19px;font-weight:700;color:#1c1c1e;}
.pitem i{width:44px;height:44px;min-width:44px;border-radius:50%;background:#ededee;display:flex;align-items:center;justify-content:center;}
.pitem svg{width:22px;height:22px;fill:none;stroke:#1c1c1e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:16px;font-size:15px;z-index:300;opacity:0;pointer-events:none;transition:opacity .3s;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <svg class="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    <svg class="header-icon" viewBox="0 0 24 24"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.8 2.8L12 14.6l-3.8 1 1-3.8z"/></svg>
  </div>

<main class="chat" id="chat"></main>

<div class="bottom">
  <div class="inputbar">

      <svg class="wave-icon" viewBox="0 0 24 24"><line x1="4" y1="12" x2="4" y2="12"/><line x1="8.5" y1="8" x2="8.5" y2="16"/><line x1="13" y1="5" x2="13" y2="19"/><line x1="17.5" y1="8" x2="17.5" y2="16"/><line x1="22" y1="12" x2="22" y2="12"/></svg>

    <input id="input" class="input" type="text" placeholder="اسأل ChatGPT" autocomplete="off">

</div>


<div class="login" id="login">
  <div class="login-card">
    <h1>مرحباً 👋</h1>
    <p>سجّل دخولك للبدء بالمحادثة</p>
    <button id="gbtn" style="background:#fff;color:#1c1c1e;border:1px solid #d8d8dc">الدخول بحساب جوجل</button>

    <input id="gname" placeholder="اكتب اسمك" maxlength="40">
    <button id="gbtnName">دخول</button>
    <div class="login-err" id="gerr"></div>
  </div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signInAnonymously,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,doc,setDoc,updateDoc,addDoc,deleteDoc,getDoc,getDocs,collection,query,orderBy,onSnapshot,serverTimestamp,increment} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBk_hr_RSYRjTQww2KPwQcq42V1NzU7uH4",authDomain:"the-ai-ed920.firebaseapp.com",projectId:"the-ai-ed920",storageBucket:"the-ai-ed920.firebasestorage.app",messagingSenderId:"561611455865",appId:"1:561611455865:web:bb13aabf00f9f3eacf43a8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
function authMsg(e){
  const c=e.code||"";
  const m={
    "auth/unauthorized-domain":"هذا الدومين غير مضاف في Firebase. أضف ("+location.hostname+") في Authentication ← Settings ← Authorized domains",
    "auth/operation-not-allowed":"طريقة الدخول غير مفعّلة في Firebase (Authentication ← Sign-in method)",
    "auth/popup-closed-by-user":"أُغلقت نافذة الدخول قبل الإكمال، حاول مرة أخرى",
    "auth/cancelled-popup-request":"أُلغي الطلب، حاول مرة أخرى",
    "auth/popup-blocked":"المتصفح منع نافذة جوجل، اسمح بالنوافذ المنبثقة",
    "auth/network-request-failed":"لا يوجد اتصال بالإنترنت"
  };
  return m[c]||("تعذر الدخول ("+(c||e.message)+")");
}
async function googleLogin(){
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p);}
  catch(e){
    if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(auth,p);return;}catch(e2){e=e2;}}
    throw e;
  }
}

const input=document.getElementById("input"),voice=document.getElementById("voice"),chat=document.getElementById("chat");
const waveIcon=voice.querySelector(".wave-icon"),sendIcon=voice.querySelector(".send-icon");
const loginEl=document.getElementById("login"),gerr=document.getElementById("gerr");
const FALLBACK="استلمت رسالتك 🌷 سيرد عليك المشرف قريباً.";
const ACTIONS=`<div class="actions"><div class="dots-action">•••</div>
<svg class="action" data-act="share" viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M5 15v2a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-2"/></svg>
<svg class="action" data-act="like" viewBox="0 0 24 24"><path d="M7 10v10"/><path d="M7 10l3-7a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.2l-1.2 7A2 2 0 0 1 17 20H7"/><path d="M7 20H4a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h3"/></svg>
<svg class="action" data-act="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></div>`;

let isSendMode=false,uid=null,unsub=null,beat=null;
voice.insertAdjacentHTML("beforeend",'<div class="stop-icon"></div>');
const stopIcon=voice.querySelector(".stop-icon");
let generating=false,skip=false,loaded=false,unsubU=null,waiting=0,adminTyping=false,typingSafety=null,dotEl=null,chainP=Promise.resolve();
function refreshIcon(){
  waveIcon.style.display=(!generating&&!isSendMode)?"flex":"none";
  sendIcon.style.display=(!generating&&isSendMode)?"flex":"none";
  stopIcon.style.display=generating?"block":"none";
}
function toggleSend(h){isSendMode=h;refreshIcon();}
input.addEventListener("input",()=>toggleSend(input.value.trim()!==""));
voice.addEventListener("pointerdown",e=>{e.preventDefault();if(generating){skip=true;return;}if(isSendMode)sendMessage();else openVoice();});
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage();});

// إصلاح الكيبورد على iOS
const vv=window.visualViewport;
function fit(){if(!vv)return;document.documentElement.style.setProperty("--vh",vv.height+"px");document.body.style.top=vv.offsetTop+"px";window.scrollTo(0,0);chat.scrollTop=chat.scrollHeight;}
if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);}
input.addEventListener("focus",()=>setTimeout(fit,300));fit();

function attach(parent,att){
  if(!att)return;
  if(att.type==="image"){const im=document.createElement("img");im.src=att.data;im.className="pic";parent.appendChild(im);}
  else{const a=document.createElement("a");a.href=att.data;a.download=att.name||"file";a.className="fcard";a.textContent="📎 "+(att.name||"ملف");parent.appendChild(a);}
}
function addMsg(m){
  const el=document.createElement("div");
  if(m.from==="user"){
    el.className="user";attach(el,m.att);
    if(m.text){const s=document.createElement("span");s.textContent=m.text;el.appendChild(s);}
  }else{
    el.className="assistant";
    const t=document.createElement("div");t.className="ai-text";
    attach(t,m.att);
    (m.text||"").split("\n").forEach((line,i)=>{if(i)t.appendChild(document.createElement("br"));t.appendChild(document.createTextNode(line));});
    el.appendChild(t);el.insertAdjacentHTML("beforeend",ACTIONS);
  }
  chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function updateDot(){
  if(waiting>0||adminTyping){
    if(!dotEl){dotEl=document.createElement("div");dotEl.className="dotwrap";dotEl.innerHTML='<div class="tdot"></div>';}
    chat.appendChild(dotEl);chat.scrollTop=chat.scrollHeight;
  }else if(dotEl&&dotEl.parentNode){dotEl.remove();}
}
async function playAssistant(m){
  waiting++;updateDot();
  await sleep(m.from==="admin"?600:300);
  waiting--;updateDot();
  generating=true;skip=false;refreshIcon();
  const el=document.createElement("div");el.className="assistant";
  const t=document.createElement("div");t.className="ai-text";el.appendChild(t);chat.appendChild(el);attach(t,m.att);
  const full=(m.text||"").trim();
  updateDot();
  const short=full.length<=22||full.split(/\s+/).length<=3;
  if(short){
    // ردود قصيرة: تلاشي ناعم
    const sp=document.createElement("span");sp.style.cssText="opacity:0;transition:opacity .9s ease";
    full.split("\n").forEach((line,i)=>{if(i)sp.appendChild(document.createElement("br"));sp.appendChild(document.createTextNode(line));});
    t.appendChild(sp);void sp.offsetWidth;sp.style.opacity="1";
    for(let i=0;i<10&&!skip;i++)await sleep(90);
  }else{
    // ردود أطول: تأثير الآلة الكاتبة حرفاً حرفاً
    let node=document.createTextNode("");t.appendChild(node);
    const chars=Array.from(full);
    const nl=()=>{t.appendChild(document.createElement("br"));node=document.createTextNode("");t.appendChild(node);};
    for(let i=0;i<chars.length;i++){
      if(skip){chars.slice(i).forEach(x=>{if(x==="\n")nl();else node.appendData(x);});break;}
      const c=chars[i];
      if(c==="\n")nl();else node.appendData(c);
      chat.scrollTop=chat.scrollHeight;
      await sleep(/[.،,؟?!]/.test(c)?220:(c===" "?30:24));
    }
  }
  el.insertAdjacentHTML("beforeend",ACTIONS);
  updateDot();chat.scrollTop=chat.scrollHeight;
  generating=false;refreshIcon();
}
function enqueue(m,instant){
  chainP=chainP.then(()=>(instant||m.from==="user")?addMsg(m):playAssistant(m)).catch(()=>{});
}
const norm=s=>String(s).toLowerCase().replace(/[\u064B-\u065F]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
async function matchReply(text){
  const t=norm(text);let best=null,len=0;
  (await getDocs(collection(db,"replies"))).forEach(d=>{
    const r=d.data();
    r.keywords.split(/[,،\n]/).map(x=>norm(x.trim())).filter(Boolean).forEach(k=>{if(t.includes(k)&&k.length>len){best=r.answer;len=k.length;}});
  });
  if(best&&best.includes("|||")){const v=best.split("|||").map(x=>x.trim()).filter(Boolean);best=v[Math.floor(Math.random()*v.length)];}
  return best;
}
async function sendMessage(){
  const text=input.value.trim();
  if(!text)return;
  if(!uid){addMsg({from:"bot",text:"⚠️ سجّل الدخول أولاً."});return;}
  input.value="";toggleSend(false);
  try{
    const mref=collection(db,"users",uid,"messages");
    await addDoc(mref,{from:"user",text,at:serverTimestamp()});
    await updateDoc(doc(db,"users",uid),{lastMessage:text,lastAt:Date.now(),unread:increment(1)});
    const u=(await getDoc(doc(db,"users",uid))).data();
    if(u.inCall)return;
    if(u.humanUntil&&u.humanUntil>Date.now())return;
    const ans=await matchReply(text);
    waiting++;updateDot();
    try{await sleep(900);await addDoc(mref,{from:"bot",text:ans||FALLBACK,at:serverTimestamp()});}
    finally{waiting--;updateDot();}
  }catch(e){addMsg({from:"bot",text:"⚠️ تعذر الإرسال ("+(e.code||e.message)+"). تأكد من نشر قواعد Firestore."});}
}

// تسجيل الدخول
document.getElementById("gbtn").onclick=async()=>{
  gerr.textContent="";
  try{await googleLogin();}catch(e){gerr.textContent=authMsg(e);}
};
document.getElementById("gbtnName").onclick=async()=>{
  const n=document.getElementById("gname").value.trim();
  if(!n){gerr.textContent="اكتب اسمك";return;}
  localStorage.setItem("aiName",n);
  try{await signInAnonymously(auth);}catch(e){gerr.textContent=authMsg(e);}
};

// ===== الوضع الصوتي =====
const VCFG={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};

const vAud=document.createElement("audio");vAud.autoplay=true;vAud.setAttribute("playsinline","");document.body.appendChild(vAud);
const $v=id=>document.getElementById(id);
let vpc=null,vlocal=null,vcid=null,vUnsubCall=null,vUnsubCand=null,vLvl=null,vMuted=false,vPending=[],vEnded=true;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let vRecog=null,vPhase1=false,vJoinUnsub=null;
const cj=c=>JSON.parse(JSON.stringify(c.toJSON()));
function setVS(t){$v("voS").textContent=t;}
function openVoice(){
  if(!uid){toast("سجّل الدخول أولاً");return;}
  vo.classList.add("show");$v("voW").style.display="flex";$v("voL").style.display="none";
}
$v("voClose").onclick=()=>vo.classList.remove("show");

$v("voEnd").onclick=()=>endCall(true);
$v("voMute").onclick=()=>{
  vMuted=!vMuted;
  if(vlocal)vlocal.getAudioTracks().forEach(t=>t.enabled=!vMuted);
  $v("voMute").classList.toggle("red",vMuted);
};
function watchLevel(stream){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const an=ctx.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.82;
    ctx.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    let cur=1,raf=null;
    cancelAnimationFrame(vLvl);
    const loop=()=>{
      an.getByteTimeDomainData(buf);let s=0;
      for(const v of buf){const x=(v-128)/128;s+=x*x;}
      const l=Math.min(1,Math.sqrt(s/buf.length)*4.2);
      const target=1+l*0.13;
      cur+=(target-cur)*0.18;
      $v("voBall").style.transform="scale("+cur.toFixed(4)+")";
      vLvl=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){}
}
async function beginVoice(){
  if(!vlocal){
    try{vlocal=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(e){toast("لازم تسمح للمايكروفون");return;}
  }
  $v("voW").style.display="none";$v("voL").style.display="flex";
  vMuted=false;$v("voMute").classList.remove("red");vEnded=false;
  updateDoc(doc(db,"users",uid),{voiceActive:true,inCall:true}).catch(()=>{});
  watchJoin();
  if(SR){vPhase1=true;setVS("");startRecog();watchLevel(vlocal);}
  else{await startCall();}
}
function pickArVoice(){
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/^ar/i.test(v.lang))||vs.find(v=>/ar/i.test(v.lang))||vs[0];
}
function speak(text){
  return new Promise(res=>{
    if(!text){res();return;}
    try{speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text),v=pickArVoice();
      if(v)u.voice=v;u.lang=(v&&v.lang)||"ar-SA";u.pitch=0.82;u.rate=1.03;
      u.onend=res;u.onerror=res;speechSynthesis.speak(u);
    }catch(e){res();}
  });
}
function startRecog(){
  if(!SR||!vPhase1)return;
  vRecog=new SR();vRecog.lang="ar-SA";vRecog.continuous=true;vRecog.interimResults=true;
  vRecog.onresult=async e=>{
    const r=e.results[e.results.length-1];if(!r.isFinal)return;
    const text=(r[0].transcript||"").trim();if(!text||!vPhase1)return;
    setVS(text);
    try{await addDoc(collection(db,"users",uid,"messages"),{from:"user",text,at:serverTimestamp()});}catch(e){}
    const ans=(await matchReply(text))||FALLBACK;
    try{await addDoc(collection(db,"users",uid,"messages"),{from:"bot",text:ans,at:serverTimestamp()});}catch(e){}
    await speak(ans);
    if(vPhase1)setVS("");
  };
  vRecog.onerror=()=>{};
  vRecog.onend=()=>{if(vPhase1)try{vRecog.start();}catch(e){}};
  try{vRecog.start();}catch(e){}
}
function stopRecog(){
  vPhase1=false;
  if(vRecog){try{vRecog.onend=null;vRecog.stop();}catch(e){}vRecog=null;}
  try{speechSynthesis.cancel();}catch(e){}
}
function watchJoin(){
  if(vJoinUnsub)return;
  vJoinUnsub=onSnapshot(doc(db,"calls",uid),async s=>{
    const d=s.data();
    if(!d||!d.adminOffer||vpc||vEnded)return;
    stopRecog();setVS("جارٍ التوصيل...");
    const jcid=d.joinCid;
    vpc=new RTCPeerConnection(VCFG);
    vlocal.getTracks().forEach(t=>vpc.addTrack(t,vlocal));
    vpc.ontrack=e=>{vAud.srcObject=e.streams[0];vAud.play().catch(()=>{});watchLevel(e.streams[0]);};
    vpc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,"calls",uid,"cand"),{...cj(e.candidate),cid:jcid,by:"u"}).catch(()=>{});};
    vpc.onconnectionstatechange=()=>{
      if(!vpc)return;
      if(vpc.connectionState==="connected")setVS("متصل");
      else if(vpc.connectionState==="failed")setVS("تعذر الاتصال، جرّب شبكة أخرى");
    };
    try{
      await vpc.setRemoteDescription(d.adminOffer);
      const ans=await vpc.createAnswer();await vpc.setLocalDescription(ans);
      await updateDoc(doc(db,"calls",uid),{adminAnswer:{type:ans.type,sdp:ans.sdp}});
    }catch(e){setVS("تعذر إتمام الاتصال");return;}
    if(vUnsubCand)vUnsubCand();
    vUnsubCand=onSnapshot(collection(db,"calls",uid,"cand"),snap=>snap.docChanges().forEach(ch=>{
      if(ch.type!=="added")return;const c=ch.doc.data();
      if(c.cid!==jcid||c.by!=="a")return;
      vpc.addIceCandidate({candidate:c.candidate,sdpMid:c.sdpMid,sdpMLineIndex:c.sdpMLineIndex}).catch(()=>{});
    }));
  });
}
async function startCall(){
  if(!vlocal){
    try{vlocal=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(e){toast("لازم تسمح للمايكروفون");return;}
  }
  $v("voW").style.display="none";$v("voL").style.display="flex";
  setVS("جارٍ الاتصال...");vMuted=false;$v("voMute").classList.remove("red");
  vcid=Date.now().toString(36);vPending=[];vEnded=false;
  vpc=new RTCPeerConnection(VCFG);
  vlocal.getTracks().forEach(t=>vpc.addTrack(t,vlocal));
  vpc.ontrack=e=>{vAud.srcObject=e.streams[0];vAud.play().catch(()=>{});watchLevel(e.streams[0]);};
  vpc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,"calls",uid,"cand"),{...cj(e.candidate),cid:vcid,by:"u"}).catch(()=>{});};
  vpc.onconnectionstatechange=()=>{
    if(!vpc)return;
    if(vpc.connectionState==="connected")setVS("متصل");
    else if(vpc.connectionState==="failed")setVS("تعذر الاتصال، جرّب شبكة أخرى");
  };
  try{
    const offer=await vpc.createOffer();await vpc.setLocalDescription(offer);
    await updateDoc(doc(db,"users",uid),{inCall:true}).catch(()=>{});
  await setDoc(doc(db,"calls",uid),{status:"ringing",cid:vcid,name:localStorage.getItem("aiName")||(auth.currentUser&&auth.currentUser.displayName)||"مستخدم",offer:{type:offer.type,sdp:offer.sdp},answer:null,createdAt:Date.now()});
  }catch(e){toast("تعذر بدء الاتصال ("+(e.code||e.message)+")");endCall(false);return;}
  vUnsubCall=onSnapshot(doc(db,"calls",uid),async s=>{
    const d=s.data();if(!d||d.cid!==vcid||!vpc)return;
    if(d.answer&&!vpc.remoteDescription){
      await vpc.setRemoteDescription(d.answer);
      vPending.forEach(c=>vpc.addIceCandidate(c).catch(()=>{}));vPending=[];
      setVS("جارٍ التوصيل...");
    }
    if(d.status==="ended")endCall(false);
  });
  vUnsubCand=onSnapshot(collection(db,"calls",uid,"cand"),snap=>snap.docChanges().forEach(ch=>{
    if(ch.type!=="added")return;const c=ch.doc.data();
    if(c.cid!==vcid||c.by!=="a")return;
    const ice={candidate:c.candidate,sdpMid:c.sdpMid,sdpMLineIndex:c.sdpMLineIndex};
    if(vpc&&vpc.remoteDescription)vpc.addIceCandidate(ice).catch(()=>{});else vPending.push(ice);
  }));
}
function endCall(notify){
  if(vEnded)return;vEnded=true;
  stopRecog();
  updateDoc(doc(db,"users",uid),{inCall:false,voiceActive:false}).catch(()=>{});
  if(notify)updateDoc(doc(db,"calls",uid),{status:"ended",adminOffer:null,adminAnswer:null}).catch(()=>{});
  if(vJoinUnsub)vJoinUnsub();vJoinUnsub=null;
  try{vpc&&vpc.close();}catch(e){}vpc=null;
  if(vlocal)vlocal.getTracks().forEach(t=>t.stop());vlocal=null;
  if(vUnsubCall)vUnsubCall();if(vUnsubCand)vUnsubCand();vUnsubCall=vUnsubCand=null;
  cancelAnimationFrame(vLvl);vAud.srcObject=null;
  vo.classList.remove("show");
}

async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);}
  catch{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch{}ta.remove();}
}
chat.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const box=b.closest(".assistant"),txt=box?(box.querySelector(".ai-text").innerText||"").trim():"";
  const act=b.dataset.act;
  if(act==="copy"){await copyText(txt);toast("تم النسخ ✓");}
  else if(act==="like"){b.classList.toggle("liked");}
  else if(act==="share"){if(navigator.share){navigator.share({text:txt}).catch(()=>{});}else{await copyText(txt);toast("تم نسخ النص للمشاركة");}}
});

function mkInput(accept,capture){const i=document.createElement("input");i.type="file";i.accept=accept;if(capture)i.setAttribute("capture","environment");i.style.display="none";document.body.appendChild(i);i.addEventListener("change",()=>{const f=i.files[0];i.value="";handleFile(f);});return i;}

// ===== إرسال الصور والملفات =====
function readData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
async function toImage(file){
  const src=await readData(file);
  return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const M=900,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.72));};im.onerror=rej;im.src=src;});
}
async function sendAtt(att,label){
  if(!uid){toast("سجّل الدخول أولاً");return;}
  await addDoc(collection(db,"users",uid,"messages"),{from:"user",text:"",att,at:serverTimestamp()});
  await updateDoc(doc(db,"users",uid),{lastMessage:label,lastAt:Date.now(),unread:increment(1)});
}
async function handleFile(file){
  if(!file)return;
  try{
    if(file.type.startsWith("image/")){toast("جارٍ الإرسال...");await sendAtt({type:"image",data:await toImage(file)},"📷 صورة");}
    else{
      if(file.size>500*1024){toast("الملف كبير (الحد 500 كيلوبايت)");return;}
      toast("جارٍ الإرسال...");await sendAtt({type:"file",data:await readData(file),name:file.name},"📎 "+file.name);
    }
  }catch(e){toast("تعذر الإرسال");}
}

onAuthStateChanged(auth,async user=>{
  if(unsubU){unsubU();unsubU=null;} if(unsub){unsub();unsub=null;} if(beat){clearInterval(beat);beat=null;}
  if(!user){uid=null;loginEl.classList.add("show");return;}
  if(user.providerData.some(p=>p.providerId==="password")){await signOut(auth);return;}
  uid=user.uid;
  const name=user.displayName||localStorage.getItem("aiName")||"مستخدم";
  try{
    const ref=doc(db,"users",uid);
    if(!(await getDoc(ref)).exists())await setDoc(ref,{name,email:user.email||"",photo:user.photoURL||"",createdAt:Date.now(),lastAt:Date.now(),lastSeen:Date.now(),unread:0,lastMessage:""});
    else await updateDoc(ref,{name,email:user.email||"",photo:user.photoURL||"",lastSeen:Date.now()});
    beat=setInterval(()=>updateDoc(ref,{lastSeen:Date.now()}).catch(()=>{}),30000);
  }catch(e){gerr.textContent="خطأ في القاعدة ("+(e.code||e.message)+")";loginEl.classList.add("show");return;}
  loginEl.classList.remove("show");
  chat.innerHTML="";loaded=false;chainP=Promise.resolve();
  unsub=onSnapshot(query(collection(db,"users",uid,"messages"),orderBy("at")),snap=>{
    const first=!loaded;
    snap.docChanges().forEach(c=>{if(c.type==="added")enqueue(c.doc.data(),first);});
    loaded=true;
  });
  unsubU=onSnapshot(doc(db,"users",uid),s=>{
    const d=s.data()||{};
    adminTyping=!!d.typing;
    clearTimeout(typingSafety);
    if(adminTyping)typingSafety=setTimeout(()=>{adminTyping=false;updateDot();},8000);
    updateDot();
  });
});
