name: Build APK

on:
  push:
    branches: [flutter-app]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        id: build
        working-directory: flutter_app
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          flutter --version
          # توليد هيكل أندرويد (لا يستبدل ملفاتنا الموجودة)
          flutter create . --platforms=android --org com.mostafa.chatapp --project-name ai_chat
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          # صلاحية الإنترنت في نسخة release
          if "android.permission.INTERNET" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          # تعطيل Impeller: يسبب شاشة سوداء على بعض الأجهزة
          if "EnableImpeller" not in s:
              s = re.sub(r"(<application[^>]*>)", r'\1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="ChatGPT"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          cat "$M"
          flutter pub get
          # توقيع ثابت: كل البناءات تُوقَّع بنفس المفتاح فتُحدَّث فوق بعضها
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          flutter build apk --release --no-shrink
          APK=build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" "build/app/outputs/flutter-apk/chatgpt-v${GITHUB_RUN_NUMBER}.apk"
          ls -la build/app/outputs/flutter-apk/
          # تشخيص الحزمة (الحد الأدنى لأندرويد + التوقيع)
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BT" ]; then
            echo "== badging =="; "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk|native-code" || true
            echo "== signature =="; "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -12 || true
          fi

      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp "$GITHUB_WORKSPACE/build.log" /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log
          echo "${{ job.status }}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }} (${{ job.status }})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "ChatGPT APK #${{ github.run_number }}"
          body: "تطبيق Android — حمّل ملف chatgpt-v${{ github.run_number }}.apk وثبّته."
          files: flutter_app/build/app/outputs/flutter-apk/chatgpt-v${{ github.run_number }}.apk
