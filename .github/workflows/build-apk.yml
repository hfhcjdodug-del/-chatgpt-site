name: Build APK

on:
  push:
    branches: [flutter-app]
    paths:
      - "flutter_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        id: build
        working-directory: flutter_app
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          flutter --version
          # توليد هيكل أندرويد (لا يستبدل ملفاتنا الموجودة)
          flutter create . --platforms=android --org com.mostafa.chatapp --project-name ai_chat
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          # صلاحية الإنترنت في نسخة release
          if "android.permission.INTERNET" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>', s, count=1)
          # تعطيل Impeller: يسبب شاشة سوداء على بعض الأجهزة
          if "EnableImpeller" not in s:
              s = re.sub(r"(<application[^>]*>)", r'\1\n        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>', s, count=1)
          if "RECORD_AUDIO" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>', s, count=1)
          if "android.permission.CAMERA" not in s:
              s = re.sub(r"(<manifest[^>]*>)", r'\1\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.front" android:required="false"/>', s, count=1)
          if "RecognitionService" not in s:
              s = s.replace("</manifest>", '    <queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>\n    </queries>\n</manifest>')
          if "login-callback" not in s:
              intent = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="com.mostafa.chatapp" android:host="login-callback"/></intent-filter>'
              s = s.replace("</activity>", intent + "</activity>", 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="ChatGPT"', s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          python3 - <<'PY2'
          import os, re
          for f in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(f):
                  s = open(f, encoding="utf-8").read()
                  if "useLegacyPackaging" not in s:
                      s = re.sub(r"(^android\s*\{)", r"\1\n    packaging { jniLibs { useLegacyPackaging = true } }", s, count=1, flags=re.M)
                  # flutter_webrtc يتطلب الحد الأدنى 23
                  s = re.sub(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", s)
                  s = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", s)
                  # توقيع ثابت فعلي: الاعتماد على signingConfigs.getByName("debug") الضمني
                  # غير موثوق (يتغيّر توليده بين نسخ Flutter/المسار الفعلي لـ ~/.android)،
                  # وهذا كان يُنتج شهادة توقيع عشوائية مختلفة بكل بناء -> رسالة "التطبيق
                  # ليس مثبتاً" عند أي تحديث. نُثبّت الآن signingConfig صراحة على ملفنا.
                  is_kts = f.endswith(".kts")
                  if "ciDebugSigning" not in s:
                      if is_kts:
                          sign_block = (
                              '\n    signingConfigs {\n'
                              '        create("ciDebugSigning") {\n'
                              '            storeFile = file("../../ci/debug.keystore")\n'
                              '            storePassword = "android"\n'
                              '            keyAlias = "androiddebugkey"\n'
                              '            keyPassword = "android"\n'
                              '        }\n'
                              '    }\n'
                          )
                      else:
                          sign_block = (
                              '\n    signingConfigs {\n'
                              '        ciDebugSigning {\n'
                              '            storeFile file("../../ci/debug.keystore")\n'
                              '            storePassword "android"\n'
                              '            keyAlias "androiddebugkey"\n'
                              '            keyPassword "android"\n'
                              '        }\n'
                              '    }\n'
                          )
                      s = re.sub(r"(^android\s*\{)", lambda m: m.group(1) + sign_block, s, count=1, flags=re.M)
                      if is_kts:
                          if re.search(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', s):
                              s = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                                         'signingConfig = signingConfigs.getByName("ciDebugSigning")', s)
                          else:
                              s = re.sub(r"(release\s*\{)",
                                         lambda m: m.group(1) + '\n            signingConfig = signingConfigs.getByName("ciDebugSigning")',
                                         s, count=1)
                      else:
                          if re.search(r"signingConfig\s+signingConfigs\.debug\b", s):
                              s = re.sub(r"signingConfig\s+signingConfigs\.debug\b",
                                         "signingConfig signingConfigs.ciDebugSigning", s)
                          else:
                              s = re.sub(r"(release\s*\{)",
                                         lambda m: m.group(1) + "\n            signingConfig signingConfigs.ciDebugSigning",
                                         s, count=1)
                  open(f, "w", encoding="utf-8").write(s)
                  print("== patched", f, "==")
                  print("\n".join(s.splitlines()[:45]))
          PY2
          cat "$M"
          flutter pub get
          # توقيع ثابت: كل البناءات تُوقَّع بنفس المفتاح فتُحدَّث فوق بعضها
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          flutter build apk --release --no-shrink --split-per-abi --build-number="${GITHUB_RUN_NUMBER}" --dart-define=BUILD_NO="${GITHUB_RUN_NUMBER}"
          O=build/app/outputs/flutter-apk
          cp "$O/app-armeabi-v7a-release.apk" "$O/chatgpt-v${GITHUB_RUN_NUMBER}-arm32.apk"
          cp "$O/app-arm64-v8a-release.apk" "$O/chatgpt-v${GITHUB_RUN_NUMBER}-arm64.apk"
          APK="$O/app-arm64-v8a-release.apk"
          ls -la build/app/outputs/flutter-apk/
          # تشخيص الحزمة (الحد الأدنى لأندرويد + التوقيع)
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BT" ]; then
            echo "== badging (full) =="; "$BT/aapt2" dump badging "$APK" 2>&1 || true
            echo "== permissions =="; "$BT/aapt2" dump permissions "$APK" 2>&1 || true
            echo "== signature =="; "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -12 || true
            echo "== arm32 badging (full) =="
            "$BT/aapt2" dump badging "$O/chatgpt-v${GITHUB_RUN_NUMBER}-arm32.apk" 2>&1 || true
          fi
          # تحقّق ذاتي: شهادة التوقيع المستخدمة فعلياً يجب أن تطابق ملفنا الثابت ci/debug.keystore،
          # وإلا فستفشل عملية التثبيت فوق أي نسخة سابقة على هاتف المستخدم
          EXPECT_FP=$(keytool -list -v -keystore ci/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          ACTUAL_FP=$("$BT/apksigner" verify --print-certs "$APK" 2>/dev/null | grep "certificate SHA-256 digest" | head -1 | sed 's/.*digest: //')
          echo "== CI debug.keystore fingerprint check =="
          echo "expected (ci/debug.keystore): $EXPECT_FP"
          echo "actual   (APK signer):        $ACTUAL_FP"
          if [ -n "$EXPECT_FP" ] && [ "$EXPECT_FP" = "$ACTUAL_FP" ]; then
            echo "SIGNING CHECK: PASS — APK is signed with the pinned stable key"
          else
            echo "SIGNING CHECK: FAIL — APK is NOT signed with ci/debug.keystore; installs will keep breaking over previous versions"
          fi

      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/logs
          cp "$GITHUB_WORKSPACE/build.log" /tmp/logs/build.log 2>/dev/null || echo "no log" > /tmp/logs/build.log
          echo "${{ job.status }}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build log ${{ github.run_number }} (${{ job.status }})"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "ChatGPT APK #${{ github.run_number }}"
          body: "تطبيق Android — جرّب arm32 أولاً ثم arm64."
          files: |
            flutter_app/build/app/outputs/flutter-apk/chatgpt-v${{ github.run_number }}-arm32.apk
            flutter_app/build/app/outputs/flutter-apk/chatgpt-v${{ github.run_number }}-arm64.apk
